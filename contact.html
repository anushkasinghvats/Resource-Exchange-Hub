<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

.contact {
    background-color: #f8f8f8;
    padding: 50px 20px;
    text-align: center;
}

.contact h1 {
    color: darkred;
    font-size: 32px;
    margin-bottom: 10px;
}

.contact-intro {
    color: #555;
    font-size: 17px;
    margin-bottom: 30px;
}

.contact-box {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
}

.contact-info,
.contact-form {
    background-color: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px #aaa;
    width: 320px;
    max-width: 100%;
    box-sizing: border-box;
    text-align: left;
}

.contact h2 {
    color: darkred;
    margin-bottom: 20px;
}

.contact-info p {
    line-height: 1.8;
    color: #333;
    margin-bottom: 15px;
}

.contact-form form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.contact-form label {
    font-weight: bold;
    color: #333;
}

.contact-form input,
.contact-form textarea {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
}

.contact-form input:focus,
.contact-form textarea:focus {
    outline: 2px solid darkred;
}

.contact-form button {
    background-color: darkred;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.contact-form button:hover {
    background-color: #550000;
}

    </style>
</head>
<body>
    
<section id="contact" class="contact">

    <h1>CONTACT US</h1>

    <p class="contact-intro">
        Have questions or suggestions?
        We'd love to hear from you!
    </p>

    <div class="contact-box">

        <div class="contact-info">
            <h2>Get in Touch</h2>

            <p>
                Location: Lovely Professional
                University, Punjab
            </p>

            <p>
                Email: your-email@example.com
            </p>

            <p>
                We are here to help students
                share and discover resources.
            </p>
        </div>

        <div class="contact-form">

            <h2>Send Us a Message</h2>

            <form action="#" method="get">

                <label for="name">Your Name</label>
                <input type="text" id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <label for="message">Your Message</label>
                <textarea id="message"
                          name="message"
                          rows="5"
                          placeholder="Write your message here..."
                          required></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>
    </div>

</section>

</body>
</html>
