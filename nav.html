<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <style>
       
        .navbar {
            display: flex;
           
            align-items: center;
            background-color: #222;
            padding: 15px;
        }

        
        .navbar a {
            color: white;
    
            padding: 12px ;
            font-size: 18px;
            border-radius: 5px;
            
        }

       
        .navbar a:hover {
            background-color: #04AA6D;
            color: red;
        }

        

         .navbar a {
                width: 80%;
                text-align: center;
            }   
        
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="about.html">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
